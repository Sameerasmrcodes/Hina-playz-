name: Build HINA PLAYZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HINA-PLAYZ-Phase4-Fixed-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: hina-playz-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Build and Verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HINA-PLAYZ-Phase4-Fixed-Source.zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Missing $ZIP_FILE in repository root."
            exit 1
          }
          unzip -t "$ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
        

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and validate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "HINA-PLAYZ-Phase4-Fixed-Source.zip" -d extracted

          mapfile -t SETTINGS_FILES < <(find extracted -type f -name settings.gradle.kts)
          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one settings.gradle.kts; found ${#SETTINGS_FILES[@]}."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -n "$(find "$PROJECT_DIR/app/src/main" -name MainActivity.kt -print -quit)" || {
            echo "::error::MainActivity.kt not found."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH" || {
            echo "::error::APK not found: $APK_PATH"
            exit 1
          }
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HINA-PLAYZ-Phase4-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
          
