name: Build HINA PLAYZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HINA-PLAYZ-Phase3-Navigation.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Phase 3 Android project
        run: |
          unzip -q HINA-PLAYZ-Phase3-Navigation.zip -d .
          test -f HinaPlayzAndroid/settings.gradle.kts
          find HinaPlayzAndroid/app/src -name MainActivity.kt | grep -q .
          echo "Phase 3 project extracted successfully"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HINA PLAYZ
        working-directory: HinaPlayzAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HINA-PLAYZ-APK
          path: HinaPlayzAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
