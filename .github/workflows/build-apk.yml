name: Build HINA PLAYZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HinaPlayzAndroid-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q HinaPlayzAndroid-Source.zip -d .
          test -f HinaPlayzAndroid/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: HinaPlayzAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HINA-PLAYZ-APK
          path: HinaPlayzAndroid/app/build/outputs/apk/debug/app-debug.apk
